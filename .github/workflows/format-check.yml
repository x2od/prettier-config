name: Format check

on:
  push:
    paths:
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      # Fails the job with exit code 1 when test/ does not match expected/.
      - run: npm run test:format
